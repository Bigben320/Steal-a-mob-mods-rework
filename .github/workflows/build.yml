name: Build mod

# Мод лежит в корне репозитория Steal-a-mob-mods-rework,
# поэтому фильтров по путям и working-directory здесь нет.
on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'

      # Gradle ставится экшеном, поэтому wrapper-jar в репозитории не нужен.
      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v4
        with:
          gradle-version: '8.12'

      - name: Build
        run: gradle --no-daemon --stacktrace build

      - name: Upload jar
        if: success()
        uses: actions/upload-artifact@v4
        with:
          name: brainrot-mod
          path: build/libs/*.jar
          if-no-files-found: warn

      # При падении собираем отчёты, чтобы можно было принести их целиком.
      - name: Upload build logs
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: build-logs
          path: |
            build/reports/**
            build/tmp/**
          if-no-files-found: ignore
